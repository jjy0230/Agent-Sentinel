[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sentinel"
version = "0.1.0"
description = "Ultra-low-latency (<35ms) terminal security gateway for AI coding agents powered by AnyJev calibrated decision engine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "jjy0230"}
]
keywords = [
    "ai-agent",
    "security-gateway",
    "anyjev",
    "llm-guardrails",
    "mcp",
    "terminal-security",
    "claude-code",
    "cursor"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration"
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
anyjev = [
    "anyjev>=0.1.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0"
]
ast = [
    "bashlex>=0.18"
]
mcp = [
    "mcp>=1.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0"
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
